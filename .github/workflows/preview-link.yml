# Posts (and keeps updated) one comment on every pull request with the Cloudflare preview link,
# so the approver can open the edited site next to the live one.
# Cloudflare names branch previews "<branch>-www.<account>.workers.dev" (branch lowercased, other characters as "-").
name: preview-link

on:
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  pull-requests: write

jobs:
  comment:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/github-script@v7
        env:
          LIVE: https://www.s-majbour.workers.dev
          WORKER: www
          ACCOUNT_SUBDOMAIN: s-majbour
        with:
          script: |
            const pr = context.payload.pull_request;
            const alias = pr.head.ref.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '');
            const preview = `https://${alias}-${process.env.WORKER}.${process.env.ACCOUNT_SUBDOMAIN}.workers.dev`;
            const live = process.env.LIVE;
            const marker = '<!-- preview-link -->';
            const body = [
              marker,
              '### 👀 See this change on the website',
              '',
              '| | English | Arabic |',
              '| --- | --- | --- |',
              `| **This pull request** | [Open preview](${preview}/en/) | [Open preview](${preview}/ar/) |`,
              `| **Live site now** | [Open live](${live}/en/) | [Open live](${live}/ar/) |`,
              '',
              'Open both on your phone and compare. The preview is ready about 2 minutes after each new commit (when **Workers Builds: www** turns green below); before that it may show the previous version or "not found".',
              '',
              '_The preview uses the live content and database, so it is for checking design and code. Nothing goes live until this pull request is approved and merged._',
            ].join('\n');
            const { owner, repo } = context.repo;
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number: pr.number });
            const mine = comments.find(c => c.body && c.body.includes(marker));
            if (mine) await github.rest.issues.updateComment({ owner, repo, comment_id: mine.id, body });
            else await github.rest.issues.createComment({ owner, repo, issue_number: pr.number, body });
